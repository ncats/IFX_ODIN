<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="425" viewBox="0 0 2500 850" role="img" aria-labelledby="title desc">
  <title id="title">Durable evidence, revisable harmonization decisions, and materialized lineage</title>
  <desc id="desc">Three source metabolite identifiers carry mapping, pathway, and reaction evidence. In the revisable decision layer, a curation explicitly ignores the mapping between HMDB ID A and KEGG ID C. Dotted boundaries show HMDB ID A and ChEBI ID B grouped in one clique while KEGG ID C remains in another. The materialized result links each clique to its source identifier members and preserves their pathway and reaction relationships.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1700" height="850" fill="#f8fafc"/>

  <rect x="35" y="30" width="790" height="785" rx="28" fill="#ffffff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
  <text x="75" y="83" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#115e59">Durable evidence layer</text>
  <text x="75" y="117" font-family="Inter, Arial, sans-serif" font-size="19" fill="#64748b">Source identifiers remain distinct; assertions stay attached to the ID the source used.</text>

