  <text x="263" y="717" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#115e59">Evidence records what each source asserted.</text>
  <text x="263" y="741" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0f766e">It does not commit RaMP to one grouping.</text>

