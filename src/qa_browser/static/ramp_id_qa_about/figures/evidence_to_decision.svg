<svg xmlns="http://www.w3.org/2000/svg" width="850" height="425" viewBox="0 0 1700 850" role="img" aria-labelledby="title desc">
  <title id="title">Durable evidence and revisable harmonization decisions</title>
  <desc id="desc">Three source metabolite identifiers carry mapping, pathway, and reaction evidence. A revisable rule accepts one mapping and rejects another, producing two clique nodes linked to their source identifier members, which remain linked to their original biological payload.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1700" height="850" fill="#f8fafc"/>

  <rect x="35" y="30" width="790" height="785" rx="28" fill="#ffffff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
  <text x="75" y="83" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#115e59">Durable evidence layer</text>
  <text x="75" y="117" font-family="Inter, Arial, sans-serif" font-size="19" fill="#64748b">Source identifiers remain distinct; assertions stay attached to the ID the source used.</text>

  <circle cx="280" cy="330" r="82" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="280" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#075985">HMDB:</text>
  <text x="280" y="350" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#0369a1">ID_A</text>
  <circle cx="555" cy="250" r="82" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <text x="555" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#92400e">CHEBI:</text>
  <text x="555" y="270" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#b45309">ID_B</text>
  <circle cx="555" cy="510" r="82" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
  <text x="555" y="500" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#5b21b6">REFMET:</text>
  <text x="555" y="530" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" fill="#6d28d9">ID_C</text>

  <line x1="359" y1="307" x2="476" y2="273" stroke="#0f766e" stroke-width="6"/>
  <line x1="353" y1="374" x2="482" y2="466" stroke="#0f766e" stroke-width="6"/>
  <rect x="353" y="197" width="133" height="34" rx="17" fill="#ccfbf1"/>
  <text x="420" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#115e59">maps_to</text>
  <rect x="354" y="427" width="133" height="34" rx="17" fill="#ccfbf1"/>
  <text x="421" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#115e59">maps_to</text>

  <rect x="82" y="505" width="190" height="82" rx="15" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
  <text x="177" y="538" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#3f6212">Pathway α</text>
  <text x="177" y="565" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4d7c0f">reported for HMDB:ID_A</text>
  <line x1="230" y1="505" x2="259" y2="409" stroke="#65a30d" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="603" y="346" width="180" height="82" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="693" y="379" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Reaction 101</text>
  <text x="693" y="406" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#b91c1c">uses CHEBI:ID_B</text>
  <line x1="653" y1="346" x2="604" y2="315" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="530" y="650" width="215" height="82" rx="15" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
  <text x="638" y="683" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#3f6212">Pathway β</text>
  <text x="638" y="710" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4d7c0f">reported for REFMET:ID_C</text>
  <line x1="607" y1="650" x2="577" y2="590" stroke="#65a30d" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="75" y="690" width="375" height="67" rx="15" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text x="263" y="717" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#115e59">Evidence records what each source asserted.</text>
  <text x="263" y="741" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0f766e">It does not commit RaMP to one grouping.</text>

  <line x1="825" y1="420" x2="885" y2="420" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="890" y="30" width="775" height="785" rx="28" fill="#ffffff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="930" y="83" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#5b21b6">Revisable decision layer</text>
  <text x="930" y="117" font-family="Inter, Arial, sans-serif" font-size="19" fill="#64748b">Rules produce clique outputs while retaining source-ID links.</text>

  <text x="930" y="151" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">RULE PROFILE</text>
  <rect x="930" y="158" width="205" height="42" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1032" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Ignore generic structures</text>
  <line x1="1139" y1="179" x2="1161" y2="179" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1167" y="158" width="190" height="42" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1262" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Apply curations</text>
  <line x1="1361" y1="179" x2="1383" y2="179" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1389" y="158" width="231" height="42" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1504" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Clean up</text>

  <text x="1015" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#64748b">CLIQUE OUTPUT</text>
  <text x="1240" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#64748b">SOURCE-ID MEMBERS</text>
  <text x="1520" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#64748b">SOURCE PAYLOAD</text>

  <circle cx="1015" cy="340" r="88" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <text x="1015" y="323" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">Clique 1</text>
  <text x="1015" y="355" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#475569">RAMP_C…01</text>
  <text x="1015" y="383" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">2 members</text>
  <circle cx="1015" cy="610" r="80" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <text x="1015" y="595" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">Clique 2</text>
  <text x="1015" y="627" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#475569">RAMP_C…02</text>
  <text x="1015" y="654" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">1 member</text>

  <circle cx="1240" cy="279" r="45" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="1240" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#075985">HMDB:</text>
  <text x="1240" y="294" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#0369a1">ID_A</text>
  <circle cx="1240" cy="369" r="45" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="1240" y="363" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#92400e">CHEBI:</text>
  <text x="1240" y="384" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#b45309">ID_B</text>
  <circle cx="1240" cy="609" r="45" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="1240" y="603" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#5b21b6">REFMET:</text>
  <text x="1240" y="624" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#6d28d9">ID_C</text>

  <line x1="1100" y1="316" x2="1192" y2="288" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1103" y1="357" x2="1192" y2="367" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1095" y1="610" x2="1187" y2="609" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1125" y="252" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">has member</text>

  <rect x="1435" y="246" width="185" height="66" rx="14" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
  <text x="1527" y="286" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#3f6212">Pathway α</text>
  <rect x="1435" y="336" width="185" height="66" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="1527" y="376" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#991b1b">Reaction 101</text>
  <rect x="1435" y="576" width="185" height="66" rx="14" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
  <text x="1527" y="616" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#3f6212">Pathway β</text>
  <line x1="1285" y1="279" x2="1427" y2="279" stroke="#65a30d" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1285" y1="369" x2="1427" y2="369" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1285" y1="609" x2="1427" y2="609" stroke="#65a30d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1379" y="259" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">source assertion</text>

</svg>
