<svg xmlns="http://www.w3.org/2000/svg" width="850" height="425" viewBox="0 0 1700 850" role="img" aria-labelledby="title desc">
  <title id="title">Validation checks for a harmonized metabolite snapshot</title>
  <desc id="desc">An illustrative saved snapshot is checked for molecular-weight spreads above ten percent and denylisted identifier pairs that remain in the same clique through a transitive path. The validation report counts alerts and affected cliques and retains member-level details.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1700" height="850" fill="#f8fafc"/>

  <rect x="55" y="30" width="1590" height="64" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="78" y="45" width="205" height="34" rx="17" fill="#e2e8f0"/>
  <text x="180" y="68" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">ILLUSTRATIVE SNAPSHOT</text>
  <text x="315" y="70" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Run the same checks against every saved harmonization stage</text>

  <rect x="55" y="120" width="760" height="565" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="90" y="169" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#92400e">1 · Molecular-weight consistency</text>
  <text x="90" y="202" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Does one clique contain mass evidence that is too far apart?</text>

  <circle cx="265" cy="390" r="105" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <text x="265" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Clique 17</text>
  <text x="265" y="406" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#475569">3 source IDs</text>
  <text x="265" y="436" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">one proposed metabolite</text>

  <rect x="430" y="270" width="300" height="205" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="455" y="306" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="#92400e">HMDB:ID_A</text>
  <text x="700" y="306" text-anchor="end" font-family="ui-monospace, monospace" font-size="17" fill="#92400e">100.0 Da</text>
  <line x1="455" y1="324" x2="705" y2="324" stroke="#fde68a" stroke-width="2"/>
  <text x="455" y="356" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="#92400e">CHEBI:ID_B</text>
  <text x="700" y="356" text-anchor="end" font-family="ui-monospace, monospace" font-size="17" fill="#92400e">111.0 Da</text>
  <line x1="455" y1="374" x2="705" y2="374" stroke="#fde68a" stroke-width="2"/>
  <text x="455" y="406" font-family="ui-monospace, monospace" font-size="17" font-weight="700" fill="#92400e">PUBCHEM:ID_C</text>
  <text x="700" y="406" text-anchor="end" font-family="ui-monospace, monospace" font-size="17" fill="#92400e">100.5 Da</text>
  <rect x="465" y="431" width="230" height="31" rx="15" fill="#fef3c7"/>
  <text x="580" y="453" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">spread = 11% · threshold = 10%</text>
  <line x1="370" y1="390" x2="420" y2="390" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="105" y="535" width="650" height="105" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="430" y="571" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">MW alert</text>
  <text x="430" y="601" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#9a3412">Count the clique and retain its IDs, source masses, and calculated spread.</text>
  <text x="430" y="624" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#c2410c">An alert identifies a review candidate; it does not silently split the clique.</text>

  <rect x="885" y="120" width="760" height="565" rx="26" fill="#ffffff" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="920" y="169" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#991b1b">2 · Denied equivalence still connected</text>
  <text x="920" y="202" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Did removing one edge fail because another path joins the IDs transitively?</text>

  <ellipse cx="1240" cy="400" rx="290" ry="135" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="1040" cy="405" r="62" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="1040" y="399" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#075985">ID_A</text>
  <text x="1040" y="423" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0369a1">denied pair</text>
  <circle cx="1240" cy="350" r="62" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <text x="1240" y="344" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#92400e">ID_C</text>
  <text x="1240" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b45309">bridge ID</text>
  <circle cx="1440" cy="405" r="62" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
  <text x="1440" y="399" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#5b21b6">ID_B</text>
  <text x="1440" y="423" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6d28d9">denied pair</text>
  <line x1="1100" y1="389" x2="1179" y2="367" stroke="#0f766e" stroke-width="6"/>
  <line x1="1301" y1="367" x2="1380" y2="389" stroke="#0f766e" stroke-width="6"/>
  <text x="1140" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">active</text>
  <text x="1340" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">active</text>
  <line x1="1102" y1="443" x2="1378" y2="443" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="1218" y1="427" x2="1262" y2="459" stroke="#dc2626" stroke-width="7"/>
  <line x1="1262" y1="427" x2="1218" y2="459" stroke="#dc2626" stroke-width="7"/>
  <text x="1240" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">A–B is excluded by the curation list</text>

  <rect x="935" y="535" width="660" height="105" rx="18" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="1265" y="571" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Denylist alert</text>
  <text x="1265" y="601" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#991b1b">Count the forbidden pair and the affected clique containing it.</text>
  <text x="1265" y="624" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#b91c1c">The A–C–B path explains why the two denied IDs still resolve together.</text>

  <rect x="55" y="720" width="1590" height="95" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="750" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#64748b">STAGE VALIDATION SUMMARY</text>
  <text x="105" y="779" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">MW ALERTS</text>
  <text x="105" y="804" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">1</text>
  <text x="330" y="779" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">DENYLIST PAIRS CHECKED</text>
  <text x="330" y="804" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">1</text>
  <text x="655" y="779" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">PAIRS STILL MERGED</text>
  <text x="655" y="804" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">1</text>
  <text x="930" y="779" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">AFFECTED CLIQUES</text>
  <text x="930" y="804" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">1</text>
  <text x="1200" y="779" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">RULE CONTEXT</text>
  <text x="1200" y="804" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">10% · denylist enabled</text>
  <text x="1485" y="779" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">DRILL-DOWN</text>
  <text x="1485" y="804" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">IDs · masses · pairs</text>
</svg>
