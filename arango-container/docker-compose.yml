services:
  arangodb:
    image: arangodb:latest
    container_name: local_arangodb
    env_file:
      - secrets.env
    ports:
      - "8042:8529"
    volumes:
      - data:/var/lib/arangodb3
      - apps:/var/lib/arangodb3-apps
    networks:
      - dashboard_network
    restart: unless-stopped

volumes:
  data:
  apps:

networks:
  dashboard_network:
    external: true
    name: shared_dashboard_network
